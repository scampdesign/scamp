<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App shell</title>
<!--
  Three cases from a real dashboard import (see docs/notes/import-parity-log.md):
  a grid laid out by named areas, a logo whose short form is hidden at this
  width, and controls sized by the author inside wrappers that hug them.
-->
<style>
  body { margin: 0; font: 14px/20px system-ui, sans-serif; }
  .shell { display: grid; grid-template-areas: "nav centre panel"; grid-template-columns: 240px minmax(0, 1fr) 360px; min-height: 600px; }
  .sidebar { grid-area: nav; background: #eef3f9; padding: 24px 16px; }
  .centre { grid-area: centre; padding: 24px; }
  .panel { grid-area: panel; background: #f5f8fc; padding: 24px; }
  .logo-name { font-weight: 700; }
  .logo-short { display: none; }
  .tools { display: flex; gap: 8px; }
  .anchor { position: relative; display: flex; }
  .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 1px solid #d9e2ee; border-radius: 50%; background: transparent; }
  .icon-button svg { width: 20px; height: 20px; }
  .button { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; border: 1px solid #7a8aa1; border-radius: 12px; background: #fff; font: 600 14px/20px system-ui, sans-serif; white-space: nowrap; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: #e6f4fc; font-weight: 600; }
</style>
</head>
<body>
  <div class="shell">
    <nav class="sidebar">
      <p class="logo"><span class="logo-name">Resova iQ</span><span class="logo-short" aria-hidden="true">iQ</span></p>
    </nav>
    <main class="centre">
      <button class="button" type="button">Upload audio</button>
      <span class="avatar">PR</span>
    </main>
    <aside class="panel">
      <div class="tools">
        <div class="anchor">
          <button class="icon-button" type="button" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"></circle></svg></button>
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
