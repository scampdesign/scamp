appId: com.scamp.app
productName: Scamp
directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - node_modules/**/*
  - "!node_modules/**/{test,__tests__,tests}/**"
  - "!node_modules/**/*.{md,ts,map}"

# Bundle the app icon at runtime so the BrowserWindow can load it after
# packaging. `build/` is only available at build time — files dropped
# under `extraResources` land in the packaged app's resources directory
# (accessible via `process.resourcesPath` from the main process).
extraResources:
  - from: src/renderer/src/assets/scamp-icon.png
    to: scamp-icon.png

# Native modules (node-pty) need to be rebuilt for the target platform.
npmRebuild: true

# `sharp` loads libvips from a SEPARATE package (`@img/sharp-<platform>`),
# which the automatic native-module detection doesn't follow — and a
# `.node` inside the asar can't be dlopen'd. The image-conversion child
# process is forked by path, which also can't come from inside the asar.
# All three would work in dev and fail only once packaged.
# see docs/plans/image-import-speed-plan.md
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  # sharp's own runtime dependencies. Resolution from the unpacked copy
  # walks up `app.asar.unpacked/node_modules` and cannot fall back into
  # the asar, so leaving these packed fails with "Cannot find module
  # 'detect-libc'" — in the packaged build only.
  - "**/node_modules/detect-libc/**"
  - "**/node_modules/semver/**"
  - "**/out/main/imageOptimizeChild.js"

# Auto-update feed. electron-builder writes an `app-update.yml` into the
# package from the FIRST entry only (publishConfigs[0]), and
# electron-updater reads exactly one provider with no fallback — so the
# order here decides which feed installed apps poll. `generic` (our R2
# bucket) must stay first. The `github` entry still receives every
# release: that copy is how installs from before the R2 feed find the
# next version. electron-builder uploads nothing for `generic`; the
# release workflow copies the artifacts to R2 itself.
# see docs/notes/update-feed-migration.md
publish:
  - provider: generic
    url: https://updates.scamp.club
  - provider: github
    owner: scampdesign
    repo: scamp

mac:
  category: public.app-category.developer-tools
  icon: src/renderer/src/assets/scamp-icon.png
  # `zip` is required alongside `dmg`: electron-updater downloads the zip
  # for macOS auto-updates (a dmg alone can't self-update).
  target:
    - dmg
    - zip
  # Hardened runtime + entitlements + notarization are required for
  # Gatekeeper to allow the downloaded app and for auto-updates to apply.
  # The signing identity is auto-discovered from the keychain (CI imports
  # the Developer ID cert); notarization runs only when the APPLE_* env
  # vars are present, so unsigned local `npm run package` builds still work.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

win:
  icon: src/renderer/src/assets/scamp-icon.png
  # Signing is driven by the CSC_LINK / CSC_KEY_PASSWORD env vars set in
  # CI (see .github/workflows/release.yml); unsigned local builds skip it.
  target:
    - nsis
    - portable

linux:
  category: Development
  icon: src/renderer/src/assets/scamp-icon.png
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
