name: Release

# Pushing a version tag (e.g. `v1.1.0`) builds all three platform
# targets, signs + notarizes them, publishes to GitHub Releases, and
# copies the installers + updater metadata to the R2 update feed.
# electron-updater clients pick the new version up on their next launch
# or 4-hour check. See docs/notes/auto-update.md,
# docs/notes/update-feed-migration.md, and Part 2.8 of
# docs/plans/auto-update-prd.md.
on:
  push:
    tags:
      - "v*"

jobs:
  # Nothing signs or publishes until this passes.
  #
  # `npm run build` below is `electron-vite build` — a bundle, not a
  # typecheck — so before this job a tag went straight to
  # `--publish always` with nothing having checked anything. A type
  # error shipped.
  #
  # The same three commands `ci.yml` runs on every push, repeated here
  # because a tag can be pushed without ever having gone through it.
  # Once, on Linux, at the 1x multiplier: about two minutes a release.
  #
  # It is a floor, not a ceiling. The end-to-end suite is not here — it
  # is 501 Playwright tests against a real Electron build and stays
  # local on purpose — so this stops a type error or a broken round
  # trip reaching an auto-updater, not a rendering bug. Run
  # `npm run build && npx playwright test` before you tag.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration

  release:
    # A failed check skips this job on all three platforms, so nothing
    # is built, nothing is published, and the R2 feed is untouched. The
    # tag stays pushed: fix, then move it or bump to the next version.
    needs: check
    runs-on: ${{ matrix.os }}
    # The release is created with the built-in GITHUB_TOKEN, which needs
    # `contents: write` to POST /releases and attach assets. Declared here
    # rather than left to the org default, which is read-only.
    #
    # It used to be a personal access token, and the org transfer is what
    # killed that: a fine-grained PAT is scoped to ONE resource owner, so
    # a token owned by a personal account cannot reach an org repo at all.
    # v0.8.6's first attempt failed on all three platforms with
    # `403 Resource not accessible by personal access token`. The built-in
    # token has no such problem — it is minted for this repository — and
    # there is nothing left to expire, rotate, or re-scope the next time
    # ownership changes. The release's author becomes github-actions[bot].
    permissions:
      contents: write
    # WIN_CERTS is surfaced as an env var so the Windows signing step can
    # gate on it (secrets can't be referenced directly in `if:`). When the
    # secret is absent the import step is skipped and electron-builder
    # produces an UNSIGNED Windows build instead of failing — flips back to
    # signed automatically once the WIN_CERTS secret is added.
    env:
      WIN_CERTS: ${{ secrets.WIN_CERTS }}
    strategy:
      # Don't cancel the other platforms if one fails — a partial release
      # is recoverable, a cancelled one wastes the successful builds.
      fail-fast: false
      matrix:
        # Pin windows-2022 (VS 2022): windows-latest migrated to a newer
        # Visual Studio that the bundled node-gyp can't detect, breaking
        # the node-pty native rebuild in postinstall. See docs/notes/auto-update.md.
        os: [macos-latest, windows-2022, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Runs the postinstall hook (patch-package + electron-rebuild of
      # node-pty for the runner's platform).
      - name: Install dependencies
        run: npm ci

      # macOS: import the Developer ID cert into a temporary keychain so
      # electron-builder auto-discovers it. Notarization is driven by the
      # APPLE_* env vars on the build step below.
      - name: Import macOS certificate
        if: runner.os == 'macOS'
        run: |
          echo "$MAC_CERTS" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" build.keychain
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

      # Windows: write the cert to disk and point electron-builder at it
      # via CSC_LINK / CSC_KEY_PASSWORD for the build step. These are
      # exported to GITHUB_ENV (not set globally) so the macOS/Linux
      # runners — where certificate.p12 doesn't exist — aren't affected.
      - name: Import Windows certificate
        # Skipped when WIN_CERTS isn't configured yet — the build then ships
        # unsigned (SmartScreen "unknown publisher") rather than failing.
        if: runner.os == 'Windows' && env.WIN_CERTS != ''
        run: |
          echo "$WIN_CERTS" | base64 -d > certificate.p12
          echo "CSC_LINK=certificate.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WIN_CERTS_PASSWORD" >> "$GITHUB_ENV"
        shell: bash
        env:
          WIN_CERTS: ${{ secrets.WIN_CERTS }}
          WIN_CERTS_PASSWORD: ${{ secrets.WIN_CERTS_PASSWORD }}

      - name: Build and publish
        run: npm run build && npx electron-builder --config electron-builder.yml --publish always
        env:
          # electron-builder's github provider reads GH_TOKEN; the value is
          # the built-in token, not the old PAT. See `permissions` above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarization (notarytool). electron-builder reads these
          # when `mac.notarize` is enabled.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # R2 is the feed baked into the app (`generic` is first in
      # electron-builder.yml's publish list), and electron-builder uploads
      # nothing for a generic provider — so copy this runner's artifacts
      # ourselves. Installers and blockmaps go first and `latest*.yml`
      # last, so the feed never names a file that isn't there yet. The
      # same files land under `archive/<version>/` for download links and
      # rollback. Missing secrets FAIL the job on purpose: a release that
      # reaches GitHub but not R2 would leave every migrated install
      # stuck with an update error.
      - name: Upload to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI 2.23+ sends CRC checksum headers by default, which R2
          # rejects; `when_required` restores the pre-2.23 behaviour.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set — add it under Settings > Secrets > Actions"
              exit 1
            fi
          done
          # Preflight with one tiny object so a wrong endpoint, bucket, or
          # a read-only token fails here with a clear message instead of
          # partway through a multipart upload of an installer.
          if ! aws s3api head-bucket --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" 2>preflight.err; then
            echo "::error::R2 preflight failed — check R2_ENDPOINT (no bucket in the path) and R2_BUCKET: $(cat preflight.err)"
            exit 1
          fi
          if ! echo "$GITHUB_RUN_ID" | aws s3 cp - "s3://$R2_BUCKET/.ci-preflight" --endpoint-url "$R2_ENDPOINT" 2>preflight.err; then
            echo "::error::R2 preflight write failed — the token needs Object Read & Write on this bucket: $(cat preflight.err)"
            exit 1
          fi
          aws s3 rm "s3://$R2_BUCKET/.ci-preflight" --endpoint-url "$R2_ENDPOINT" --quiet
          version="$(node -p "require('./package.json').version")"
          cd dist
          shopt -s nullglob
          put() {
            aws s3 cp "$1" "s3://$R2_BUCKET/$2" --endpoint-url "$R2_ENDPOINT" --no-progress
          }
          # electron-builder names the Windows installer "Scamp Setup x.y.z.exe"
          # on disk but lists it as "Scamp-Setup-x.y.z.exe" in latest.yml
          # (the same URL-safe name it uploads to GitHub), and the updater
          # fetches the yml's name — so the object key must use dashes.
          for f in *.dmg *.dmg.blockmap *.zip *.zip.blockmap *.exe *.exe.blockmap *.AppImage *.deb; do
            key="${f// /-}"
            put "$f" "$key"
            put "$f" "archive/$version/$key"
          done
          for y in latest*.yml; do
            put "$y" "$y"
            put "$y" "archive/$version/$y"
          done

  # Runs once all three uploads are in: fetches every latest*.yml from
  # the public feed URL and checks each file it names is reachable, the
  # right size, and range-capable (blockmap deltas need ranges).
  verify-feed:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify update feed
        env:
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: node scripts/verify-update-feed.mjs
