name: Intel Mac check (temporary)

# Throwaway: builds both Mac architectures unsigned, publishes nothing, and
# loads node-pty and sharp in the Intel app under Rosetta. Deleted before
# ci/intel-mac merges.
on:
  push:
    branches: [ci/intel-mac]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Add sharp's Intel binaries
        run: |
          pkgs=$(node -p "Object.entries(require('./node_modules/sharp/package.json').optionalDependencies).filter(([n]) => n.endsWith('darwin-x64')).map(([n, v]) => n + '@' + v).join(' ')")
          npm install --no-save --force $pkgs
          ls node_modules/@img
      - name: Build both architectures, unsigned
        run: npm run build && npx electron-builder --config electron-builder.yml --mac --publish never -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: What was built
        run: |
          ls -la dist
          cat dist/latest-mac.yml || echo "no latest-mac.yml"
          file dist/mac/Scamp.app/Contents/MacOS/Scamp dist/mac-arm64/Scamp.app/Contents/MacOS/Scamp
          find dist/mac/Scamp.app -name pty.node -exec file {} \;
          ls dist/mac/Scamp.app/Contents/Resources/app.asar.unpacked/node_modules/@img
      - name: Load node-pty and sharp in each app
        run: |
          softwareupdate --install-rosetta --agree-to-license
          cat > smoke.js <<'EOF'
          const res = process.argv[process.argv.length - 1];
          const pty = require(res + '/app.asar/node_modules/node-pty');
          const sharp = require(res + '/app.asar/node_modules/sharp');
          sharp({ create: { width: 2, height: 2, channels: 3, background: '#f00' } }).png().toBuffer().then((b) => {
            const p = pty.spawn('/bin/echo', ['pty-ok'], {});
            p.onData((d) => process.stdout.write(d));
            p.onExit(() => { console.log(process.arch, 'sharp-ok', b.length); process.exit(0); });
          }).catch((e) => { console.error(e); process.exit(1); });
          EOF
          for dir in mac mac-arm64; do
            app="dist/$dir/Scamp.app/Contents"
            prefix=""; [ "$dir" = mac ] && prefix="arch -x86_64"
            ELECTRON_RUN_AS_NODE=1 $prefix "$app/MacOS/Scamp" smoke.js "$app/Resources"
          done
