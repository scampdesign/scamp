<!doctype html><html><head><meta charset="utf-8"><title>Patients</title>
<style>
body{margin:0;font-family:Arial,sans-serif;font-size:14px;line-height:20px;background:#fff}
main{padding:32px}
table.patients{width:720px;border-collapse:collapse}
.patients caption{text-align:left;font-weight:bold;padding-bottom:8px}
.patients th,.patients td{padding:8px 12px;text-align:left;border-bottom:1px solid #ddd}
.patients th{background:#f3f4f6}
.patients .dob{width:140px}.patients .status{width:110px}
.patients tfoot td{font-style:italic}
</style></head><body><main>
<table class="patients"><caption>Patient list</caption>
<thead><tr><th class="name">Name</th><th class="dob">Date of birth</th><th class="status">Status</th></tr></thead>
<tbody>
<tr><td>Smith, Anna</td><td>1980-04-01</td><td>Active</td></tr>
<tr><td>Jones, Ben</td><td>1975-11-12</td><td>Away</td></tr>
<tr><td>Okafor, Chidi</td><td>1990-02-28</td><td>Active</td></tr>
</tbody>
<tfoot><tr><td colspan="2">3 patients</td><td>2 active</td></tr></tfoot>
</table></main></body></html>
